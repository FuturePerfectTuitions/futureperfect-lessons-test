name: Live frontend exact-source diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-frontend-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Read actual live portal bundle source map and routes
        shell: bash
        run: |
          set -u
          BASE='https://lessons.futureperfect.education'
          JS='portal-oe75FQBP.js'
          CSS='portal-DH0TASY8.css'

          curl --silent --show-error --location --dump-header /tmp/js.headers "$BASE/assets/$JS" -o /tmp/portal.js || true
          curl --silent --show-error --location --dump-header /tmp/map.headers "$BASE/assets/$JS.map" -o /tmp/portal.js.map || true
          curl --silent --show-error --location --dump-header /tmp/css.headers "$BASE/assets/$CSS" -o /tmp/portal.css || true

          echo '=== LIVE JS IDENTITY ==='
          cat /tmp/js.headers || true
          wc -c /tmp/portal.js || true
          sha256sum /tmp/portal.js || true
          grep -Eo 'sourceMappingURL=[^[:space:]]+' /tmp/portal.js | tail -n 5 || true

          echo '=== API ROUTES ==='
          python3 - <<'PY'
          import re
          text=open('/tmp/portal.js','r',encoding='utf-8',errors='replace').read()
          for value in sorted(set(re.findall(r'/api/v[0-9]+/[A-Za-z0-9_/?=&.{}:+-]+', text))):
              print(value)
          PY

          echo '=== KEY TEXT CONTEXT ==='
          python3 - <<'PY'
          text=open('/tmp/portal.js','r',encoding='utf-8',errors='replace').read()
          for needle in ['Choose a year or level.','Year 4','L1','Year 5','L2','Year 6','L3','11+ Practice','SATS','CURRENT','Current','Previous']:
              print('\n###',needle)
              start=0
              count=0
              while True:
                  i=text.find(needle,start)
                  if i<0 or count>=5: break
                  print(text[max(0,i-220):min(len(text),i+420)].replace('\n',' '))
                  start=i+len(needle); count+=1
          PY

          echo '=== SOURCE MAP REQUEST ==='
          cat /tmp/map.headers || true
          wc -c /tmp/portal.js.map || true
          sha256sum /tmp/portal.js.map || true
          head -c 200 /tmp/portal.js.map || true
          echo
          if jq -e . /tmp/portal.js.map >/dev/null 2>&1; then
            echo 'SOURCE MAP SOURCES:'
            jq -r '.sources[]?' /tmp/portal.js.map | head -n 300
            echo 'SOURCE MAP sourceRoot:'
            jq -r '.sourceRoot // empty' /tmp/portal.js.map
          else
            echo 'SOURCE_MAP_NOT_JSON_OR_NOT_AVAILABLE'
          fi

          echo '=== LIVE CSS ==='
          cat /tmp/css.headers || true
          wc -c /tmp/portal.css || true
          sha256sum /tmp/portal.css || true

          echo 'LIVE_PORTAL_SOURCE_MAP_DIAGNOSTIC_COMPLETE'
