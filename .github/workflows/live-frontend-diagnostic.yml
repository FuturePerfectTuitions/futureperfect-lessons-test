name: Live frontend exact-source diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-frontend-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Inspect live custom-domain routing and exact served files
        shell: bash
        run: |
          set -u
          BASE='https://lessons.futureperfect.education'
          GH='https://futureperfecttuitions.github.io/futureperfect-lessons-test'

          echo '=== DNS ==='
          getent ahosts lessons.futureperfect.education || true
          getent ahosts futureperfecttuitions.github.io || true

          fetch() {
            local name="$1" url="$2"
            echo "=== $name ==="
            curl --silent --show-error --location --dump-header "/tmp/${name}.headers" \
              --write-out 'HTTP=%{http_code} FINAL=%{url_effective} IP=%{remote_ip}\n' \
              "$url" --output "/tmp/${name}.body" || true
            cat "/tmp/${name}.headers" || true
            echo 'BODY-FIRST-200:'
            head -c 200 "/tmp/${name}.body" 2>/dev/null || true
            echo
          }

          fetch custom_root "$BASE/"
          fetch custom_index "$BASE/index.html"
          fetch custom_normalizer "$BASE/assets/maths-equivalent-home-normalizer.js?v=20260927-primary-home-1"
          fetch custom_y6fix "$BASE/assets/year6-display-sequence-fix.js?v=20260927-grouped-maths-cards-1"
          fetch custom_phase7 "$BASE/assets/phase7.js?v=20260912-y6-sats-section-1"
          fetch custom_config "$BASE/config.js"
          fetch gh_root "$GH/"
          fetch gh_index "$GH/index.html"
          fetch gh_normalizer "$GH/assets/maths-equivalent-home-normalizer.js?v=20260927-primary-home-1"

          echo '=== REPOSITORY SHA256 ==='
          sha256sum index.html assets/maths-equivalent-home-normalizer.js assets/year6-display-sequence-fix.js assets/phase7.js config.js

          echo '=== LIVE BODY SHA256 WHEN PRESENT ==='
          for f in /tmp/custom_*.body /tmp/gh_*.body; do
            [ -f "$f" ] && sha256sum "$f"
          done

          echo '=== CUSTOM DOMAIN MARKERS WHEN PRESENT ==='
          grep -F 'maths-equivalent-home-normalizer.js?v=20260927-primary-home-1' /tmp/custom_root.body /tmp/custom_index.body 2>/dev/null || true
          grep -F 'year6-display-sequence-fix.js?v=20260927-grouped-maths-cards-1' /tmp/custom_root.body /tmp/custom_index.body 2>/dev/null || true
          grep -F 'frontend-home-normalizer-v1' /tmp/custom_normalizer.body 2>/dev/null || true
          grep -F 'logicalCardGrids' /tmp/custom_y6fix.body 2>/dev/null || true
          grep -F 'readSession();' /tmp/custom_phase7.body 2>/dev/null || true
          grep -F 'https://fpt-portal-v2-worker.futureperfectlessons.workers.dev' /tmp/custom_config.body 2>/dev/null || true

          echo 'LIVE_FRONTEND_ROUTING_DIAGNOSTIC_COMPLETE'
