name: Live frontend exact-source diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-frontend-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Trace actual live portal bundle provenance
        shell: bash
        run: |
          set -u
          BASE='https://lessons.futureperfect.education'
          JS='portal-oe75FQBP.js'
          CSS='portal-DH0TASY8.css'

          curl --silent --show-error --location --dump-header /tmp/root.headers "$BASE/" -o /tmp/root.html || true
          curl --silent --show-error --location --dump-header /tmp/js.headers "$BASE/assets/$JS" -o /tmp/portal.js || true
          curl --silent --show-error --location --dump-header /tmp/css.headers "$BASE/assets/$CSS" -o /tmp/portal.css || true
          curl --silent --show-error --location --dump-header /tmp/map.headers "$BASE/assets/$JS.map" -o /tmp/portal.js.map || true

          echo '=== LIVE ROOT ==='
          cat /tmp/root.headers || true
          sha256sum /tmp/root.html || true
          grep -Eo '<script[^>]+src="[^"]+"[^>]*>' /tmp/root.html || true
          grep -Eo '<link[^>]+rel="stylesheet"[^>]+href="[^"]+"[^>]*>' /tmp/root.html || true

          echo '=== LIVE JS ==='
          cat /tmp/js.headers || true
          wc -c /tmp/portal.js || true
          sha256sum /tmp/portal.js || true
          echo 'TAIL:'
          tail -c 500 /tmp/portal.js || true
          echo
          echo 'API/DOMAIN STRINGS:'
          grep -Eo 'https?://[^"'"'[:space:]]+|/api/v1/[A-Za-z0-9_/?=&.-]+' /tmp/portal.js | sort -u | head -n 100 || true
          echo 'PORTAL TEXT STRINGS:'
          grep -Eo 'Year [456]|L[123]|11\+ Practice|Choose a year or level\.|Student Portal|SATS|Lessons|Current|Previous' /tmp/portal.js | sort | uniq -c || true
          echo 'SOURCE MAP MARKER:'
          grep -Eo 'sourceMappingURL=[^[:space:]]+' /tmp/portal.js | tail -n 5 || true

          echo '=== SOURCE MAP REQUEST ==='
          cat /tmp/map.headers || true
          wc -c /tmp/portal.js.map || true
          head -c 300 /tmp/portal.js.map || true
          echo
          if command -v jq >/dev/null 2>&1 && jq -e . /tmp/portal.js.map >/dev/null 2>&1; then
            echo 'SOURCE MAP SOURCES:'
            jq -r '.sources[]?' /tmp/portal.js.map | head -n 200
          fi

          echo '=== LIVE CSS ==='
          cat /tmp/css.headers || true
          wc -c /tmp/portal.css || true
          sha256sum /tmp/portal.css || true

          echo 'LIVE_PORTAL_BUNDLE_PROVENANCE_DIAGNOSTIC_COMPLETE'
