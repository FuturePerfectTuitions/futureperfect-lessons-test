name: Probe live frontend origin

on:
  push:
    branches:
      - fix/live-v2-year6-nested-20261001
    paths:
      - '.github/workflows/probe-live-origin-20261001.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve and inspect custom-domain origin
        shell: bash
        run: |
          set -euo pipefail
          HOST='lessons.futureperfect.education'
          BASE="https://$HOST"
          BUST="20261002-0456-3621bff2"
          echo '=== DNS A ==='
          dig +short A "$HOST" || true
          echo '=== DNS AAAA ==='
          dig +short AAAA "$HOST" || true
          echo '=== ROOT CACHED ==='
          curl --fail --silent --show-error --location --dump-header /tmp/root.headers "$BASE/" -o /tmp/root.html
          cat /tmp/root.headers
          echo '=== ROOT CACHE-BYPASS QUERY ==='
          curl --fail --silent --show-error --location \
            -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
            --dump-header /tmp/bypass.headers "$BASE/?cb=$BUST" -o /tmp/bypass.html
          cat /tmp/bypass.headers
          echo '=== IDENTITIES ==='
          sha256sum /tmp/root.html /tmp/bypass.html
          python3 - <<'PY'
          import re, pathlib
          for name in ['root','bypass']:
              text=pathlib.Path(f'/tmp/{name}.html').read_text(encoding='utf-8',errors='replace')
              print(name.upper(), 'TITLE=', re.findall(r'<title[^>]*>(.*?)</title>', text, re.I|re.S))
              print(name.upper(), 'SCRIPTS=', re.findall(r'<script[^>]+src=["\']([^"\']+)', text, re.I))
              print(name.upper(), 'STYLES=', re.findall(r'<link[^>]+href=["\']([^"\']+)', text, re.I))
          PY
          echo '=== NEW BUNDLE DIRECT ==='
          curl --fail --silent --show-error --head "$BASE/assets/portal-D_COVybH.js?cb=$BUST" || true
          echo '=== OLD BUNDLE DIRECT ==='
          curl --fail --silent --show-error --head "$BASE/assets/portal-oe75FQBP.js?cb=$BUST" || true
          echo 'LIVE_ORIGIN_BYPASS_PROBE_COMPLETE'
