name: Temporary current V2 UI port
on:
  push:
    branches: [fix-live-ui-actual-repo-20260907]
    paths:
      - '.github/workflows/tmp-port-current-v2-ui.yml'
permissions:
  contents: write
jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-live-ui-actual-repo-20260907
      - name: Port current student UI assets from V2 repo
        shell: bash
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/FuturePerfectTuitions/futureperfect-lessons-v2/main'
          curl -fsSL "$base/assets/phase7.js" -o assets/phase7.js
          curl -fsSL "$base/assets/site-chrome.css" -o assets/site-chrome.css
          curl -fsSL "$base/assets/phase18-online-prelesson-ui.js" -o assets/phase18-online-prelesson-ui.js
          curl -fsSL "$base/assets/phase19-access-ui.js" -o assets/phase19-access-ui.js
          curl -fsSL "$base/assets/phase20-recent-collapse.css" -o assets/phase20-recent-collapse.css
          curl -fsSL "$base/assets/phase20-collapsible-lessons.js" -o assets/phase20-collapsible-lessons.js

          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css_anchor = '  <link rel="stylesheet" href="assets/phase11-change8.css">\n'
          css_block = (
              '  <link rel="stylesheet" href="assets/phase11-change8.css">\n'
              '  <link rel="stylesheet" href="assets/phase16-ui-refinement.css?v=20260907-live-ui-1">\n'
              '  <link rel="stylesheet" href="assets/site-chrome.css?v=20260907-live-ui-1">\n'
              '  <link rel="stylesheet" href="assets/phase20-recent-collapse.css?v=20260907-live-ui-1">\n'
          )
          if 'phase20-recent-collapse.css' not in s:
              assert css_anchor in s
              s = s.replace(css_anchor, css_block, 1)

          home_anchor = '<p class="phase5-subject-intro">Choose a subject to continue.</p><div class="phase5-subject-grid">'
          home_block = (
              '<p class="phase5-subject-intro">Choose a subject to continue.</p>'
              '<section id="recent-shares-panel" class="phase20-recent-shares" aria-labelledby="recent-shares-heading" hidden>'
              '<div class="phase20-recent-shares-heading"><div><span class="phase7-kicker">Latest updates</span>'
              '<h2 id="recent-shares-heading">Just shared with you</h2></div></div>'
              '<div id="recent-shares-list" class="phase20-recent-shares-list"></div></section>'
              '<div class="phase5-subject-grid">'
          )
          if 'id="recent-shares-panel"' not in s:
              assert home_anchor in s
              s = s.replace(home_anchor, home_block, 1)

          old_scripts = (
              '  <script src="assets/phase11-home-readiness.js"></script>\n'
              '  <script src="assets/phase7.js"></script>\n'
              '  <script src="assets/phase7-upsell.js"></script>\n'
          )
          new_scripts = (
              '  <script src="assets/phase11-home-readiness.js"></script>\n'
              '  <script src="assets/phase18-online-prelesson-ui.js?v=20260907-live-ui-1"></script>\n'
              '  <script src="assets/phase19-access-ui.js?v=20260907-live-ui-1"></script>\n'
              '  <script src="assets/phase7.js?v=20260907-live-ui-1"></script>\n'
              '  <script src="assets/phase7-upsell.js"></script>\n'
              '  <script src="assets/phase16-ui-refinement.js?v=20260907-live-ui-1"></script>\n'
              '  <script src="assets/phase20-collapsible-lessons.js?v=20260907-live-ui-1"></script>\n'
          )
          if 'phase20-collapsible-lessons.js' not in s:
              assert old_scripts in s
              s = s.replace(old_scripts, new_scripts, 1)

          p.write_text(s, encoding='utf-8')
          PY

          node --check assets/phase7.js
          node --check assets/phase18-online-prelesson-ui.js
          node --check assets/phase19-access-ui.js
          node --check assets/phase20-collapsible-lessons.js
          grep -Fq 'Just shared with you' index.html
          grep -Fq 'phase16-ui-refinement.css?v=20260907-live-ui-1' index.html
          grep -Fq 'site-chrome.css?v=20260907-live-ui-1' index.html
          grep -Fq 'phase20-recent-collapse.css?v=20260907-live-ui-1' index.html
          grep -Fq 'phase20-collapsible-lessons.js?v=20260907-live-ui-1' index.html
          grep -Fq "closed:'Detail'" assets/phase20-collapsible-lessons.js
          grep -Fq 'background: #012169 !important;' assets/site-chrome.css
          grep -Fq 'renderRecentShares(body.recentShares)' assets/phase7.js

          git status --short
          git diff --stat
          git config user.name 'FuturePerfectTuitions'
          git config user.email 'futureperfectlessons@gmail.com'
          git add index.html assets/phase7.js assets/site-chrome.css assets/phase18-online-prelesson-ui.js assets/phase19-access-ui.js assets/phase20-recent-collapse.css assets/phase20-collapsible-lessons.js
          git commit -m 'Apply current Portal V2 student UI to live site'
          git push origin HEAD:fix-live-ui-actual-repo-20260907
