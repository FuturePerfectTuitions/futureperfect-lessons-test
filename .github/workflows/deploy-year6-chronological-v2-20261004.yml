name: Deploy Year 6 chronological V2 fix

on:
  push:
    branches:
      - fix/year6-chronological-v2-20261004
    paths:
      - '.github/workflows/deploy-year6-chronological-v2-20261004.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out corrected V2 source
        uses: actions/checkout@v4
        with:
          ref: bc794fde8f6d0ec1922f43c9090b502ee65c47da
          path: source

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and verify corrected source
        working-directory: source
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check src/app.js
          grep -q 'YEAR6_CHRONOLOGICAL_ORDER_V2_20261004' src/app.js
          ! grep -q "const viewId = section === 'sats'" src/app.js
          ! grep -q 'function activeLessonViewId' src/app.js
          npm run build
          grep -R -q 'Choose Lessons or SATS.' dist/assets/portal-*.js
          grep -R -q 'YEAR6_CHRONOLOGICAL_ORDER_V2_20261004' dist/assets/portal-*.js.map

      - name: Install Chromium
        working-directory: source
        run: npx playwright install --with-deps chromium

      - name: Year 6 chronological regression — desktop
        working-directory: source
        run: npx playwright test tests/year6-nested-v2.spec.mjs --project=desktop-chromium

      - name: Year 6 chronological regression — mobile
        working-directory: source
        run: npx playwright test tests/year6-nested-v2.spec.mjs --project=mobile-chromium

      - name: Maths Practice non-regression
        working-directory: source
        run: npx playwright test tests/step10-v2-maths-practice.spec.mjs --project=desktop-chromium

      - name: Check out current production Pages branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
          fetch-depth: 0

      - name: Forward-only production guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C production rev-parse HEAD)" = "930c15ddb5332652a012787e24b78d02e7461e9b"
          grep -q 'lessons.futureperfect.education' production/CNAME
          grep -q 'assets/portal-D3JFBMjy.js' production/index.html

      - name: Replace deployed frontend from verified build
        shell: bash
        run: |
          set -euo pipefail
          find production -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'CNAME' \
            -exec rm -rf {} +
          cp -a source/dist/. production/
          printf '%s\n' 'lessons.futureperfect.education' > production/CNAME
          touch production/.nojekyll

      - name: Verify deployment payload
        shell: bash
        run: |
          set -euo pipefail
          test -f production/index.html
          test -f production/CNAME
          grep -q 'lessons.futureperfect.education' production/CNAME
          grep -q 'assets/portal-' production/index.html
          grep -R -q 'Choose Lessons or SATS.' production/assets/portal-*.js
          grep -R -q 'YEAR6_CHRONOLOGICAL_ORDER_V2_20261004' production/assets/portal-*.js.map
          ! grep -R -q "const viewId = section === 'sats'" production/assets/portal-*.js.map
          ! grep -R -q 'function activeLessonViewId' production/assets/portal-*.js.map

      - name: Commit corrected V2 frontend to main
        shell: bash
        run: |
          set -euo pipefail
          cd production
          git config user.name 'FuturePerfectTuitions'
          git config user.email 'futureperfectlessons@gmail.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No deployment changes were required.'
            exit 0
          fi
          git commit -m 'Preserve live V2 routing with Year 6 chronological order'
          git push origin HEAD:main
