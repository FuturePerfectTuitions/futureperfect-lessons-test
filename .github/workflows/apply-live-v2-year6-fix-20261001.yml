name: Apply live V2 Year 6 nested repair

on:
  push:
    branches:
      - fix/live-v2-year6-nested-20261001
    paths:
      - '.github/workflows/apply-live-v2-year6-fix-20261001.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-v2-year6-nested-20261001
          fetch-depth: 0

      - name: Apply deterministic patch to exact recovered production source
        run: |
          set -euo pipefail
          python3 ops/patch-live-v2-year6-20261001.py
          node --check src/app.js
          grep -q 'YEAR6_NESTED_NAVIGATION_V2_20261001' src/app.js
          grep -q 'data-year6-section="lessons"' src/app.js
          grep -q 'data-year6-section="sats"' src/app.js

      - name: Commit forward-only V2 source repair
        run: |
          set -euo pipefail
          git config user.name 'FuturePerfectTuitions'
          git config user.email 'futureperfectlessons@gmail.com'
          git add src/app.js
          if git diff --cached --quiet; then
            echo 'Repair already present.'
            exit 0
          fi
          git commit -m 'Fix live V2 Year 6 nested Lessons and SATS navigation'
          git push origin HEAD:fix/live-v2-year6-nested-20261001
