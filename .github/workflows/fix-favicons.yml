name: Standardise Portal V2 favicons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-favicons.yml'

permissions:
  contents: write

jobs:
  fix-favicons:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-test' && github.event.head_commit.message == 'Run Portal V2 favicon standardisation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Standardise favicon declarations across root HTML pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          icon_block = (
              '  <link rel="icon" type="image/x-icon" href="favicon.ico">\n'
              '  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">\n'
              '  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">\n'
              '  <link rel="apple-touch-icon" href="apple-touch-icon.png">\n'
          )

          changed = []
          for path in sorted(Path('.').glob('*.html')):
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines(keepends=True)
              filtered = []
              for line in lines:
                  lower = line.lower()
                  if '<link' in lower and ('rel="icon"' in lower or "rel='icon'" in lower or 'rel="apple-touch-icon"' in lower or "rel='apple-touch-icon'" in lower):
                      continue
                  filtered.append(line)
              text = ''.join(filtered)
              if '</title>' not in text:
                  raise SystemExit(f'Missing </title> in {path}')
              text = text.replace('</title>\n', '</title>\n' + icon_block, 1)
              path.write_text(text, encoding='utf-8')
              changed.append(path.name)

          if not changed:
              raise SystemExit('No HTML files found')
          print('Standardised favicons in:', ', '.join(changed))
          PY

      - name: Commit favicon fix and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-favicons.yml
          git config user.name 'FuturePerfectTuitions'
          git config user.email 'futureperfectlessons@gmail.com'
          git add -A
          git commit -m 'Standardise Portal V2 favicons across all pages'
          git push origin main
