name: Year 6 visible-order guard V2 regression

on:
  push:
    branches:
      - fix/year6-visible-order-guard-v2-20261004
    paths:
      - 'src/app.js'
      - 'tests/year6-nested-v2.spec.mjs'
      - 'playwright.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/year6-visible-order-v2-ci-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/year6-visible-order-guard-v2-20261004

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax and production build
        run: |
          set -euo pipefail
          node --check src/app.js
          grep -q 'YEAR6_CHRONOLOGICAL_ORDER_V2_20261004' src/app.js
          grep -q 'YEAR6_VISIBLE_ORDER_GUARD_V2_20261004' src/app.js
          grep -q 'MutationObserver' src/app.js
          npm run build
          grep -R -q 'YEAR6_VISIBLE_ORDER_GUARD_V2_20261004' dist/assets/portal-*.js.map
          grep -R -q 'Choose Lessons or SATS.' dist/assets/portal-*.js

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Exact September ordering regression — desktop
        run: npx playwright test tests/year6-nested-v2.spec.mjs --project=desktop-chromium

      - name: Exact September ordering regression — mobile
        run: npx playwright test tests/year6-nested-v2.spec.mjs --project=mobile-chromium

      - name: Existing Maths Practice non-regression
        run: npx playwright test tests/step10-v2-maths-practice.spec.mjs --project=desktop-chromium
